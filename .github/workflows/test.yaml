name: Tests
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "*.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Build
        run: npm run build
      - name: Run tests with coverage
        run: |
          npm run test:coverage 2>&1 | tee test-output.txt
      - name: Create coverage report
        run: |
          echo "## Test Coverage" > coverage-comment.md
          echo "" >> coverage-comment.md
          echo '```' >> coverage-comment.md
          sed -n '/^# start of coverage report$/,/^# end of coverage report$/p' test-output.txt \
            | sed 's/^# //' >> coverage-comment.md
          echo '```' >> coverage-comment.md

          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: coverage-comment.md
