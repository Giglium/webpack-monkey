name: Setup Node
description: Setup Node.js from .nvmrc and install dependencies

inputs:
  registry-url:
    description: "Optional registry URL for npm auth"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        registry-url: ${{ inputs.registry-url }}
        cache: "npm"
    - name: Install dependencies
      shell: bash
      run: npm ci
